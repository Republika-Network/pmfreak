name: CI Governance
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The harness child-process lifecycle has a platform-specific branch: Linux reaps a
  # stabilized process tree through /proc, Windows terminates it with `taskkill /T /F`.
  # The Windows branch is skipped on every ubuntu runner, so without this job a
  # regression in it would leave the whole gate green. Focused on purpose: this runs the
  # harness lifecycle controls only, never the P0-LAUNCH-06 release rehearsal.
  windows-harness-lifecycle:
    name: Windows Harness Lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Invoked through npm so the lifecycle sets npm_execpath, which the F3 npm-identity
      # controls read. No package.json script is needed for this.
      - name: Harness child lifecycle (native Windows)
        run: npm exec -- tsx --test tests/harness-child-lifecycle.test.ts

  governance-gate:
    name: Governance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tests/pb-exec-01-execution-brief.test.ts Q5 diffs PB-EXEC-01's merged commits, which a
      # depth-1 checkout lacks. Deepen HEAD's own history only: fetching by SHA writes no
      # remote-tracking ref, so checks guarded on origin/main keep their current behaviour.
      - name: Fetch full commit history
        run: git fetch --no-tags --unshallow origin "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Runtime governance
        run: npm run check:governance
      - name: Governance ownership boundary
        run: npm run check:governance-boundary

      - name: Package purity
        run: npm run check:package-purity
