name: IP Compliance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ip-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # `compliance:check` opens with `compliance:artifacts:drift`, which proves the
      # COMMITTED inventory/summary/SBOM still describe the current lockfile before its
      # generators rewrite anything. It replaces the previous `git diff --exit-code` step:
      # that compared bytes, and the generators legitimately stamp a fresh timestamp,
      # serial number and HEAD sha on every run, so it could never pass on any commit.
      - name: Run compliance checks (includes semantic artifact drift gate)
        run: npm run compliance:check
      - name: Upload compliance artifacts
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: compliance-artifacts
          path: artifacts/compliance/
          if-no-files-found: error
