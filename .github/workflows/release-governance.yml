name: Release Governance

# P2-15. Two responsibilities, deliberately separated so that validation never carries
# release-write authority:
#
#   beta-release-validation — runs the existing `check:beta-release` orchestrator.
#     Read-only. Runs on pull_request as well as push, because a release gate that only
#     runs after merge cannot block anything. Until P2-15 this orchestrator existed, was
#     tested, and was named a launch gate in docs/productization/saas/10-launch-gates.md,
#     but no workflow invoked it.
#
#   release — versioning/publication via Changesets. Push-to-main only, and the ONLY job
#     holding `contents: write` / `pull-requests: write`. A pull_request run must never be
#     able to reach it, so it is gated on both the event and the ref, and sequenced behind
#     validation via `needs`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the release job re-grants exactly what it needs and nothing else.
permissions:
  contents: read

jobs:
  beta-release-validation:
    name: Beta Release Validation
    runs-on: ubuntu-latest
    # The orchestrator runs the governance ownership boundary, typecheck, lint, tests, the Next.js build,
    # governance, runtime/production/database/security gates and launch smoke in sequence.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # ── Ephemeral, fully isolated P0-LAUNCH-06 rehearsal fixture ──────────────
      # The rehearsal is a BLOCKING gate inside check-beta-release.mjs, so this job must
      # provision the environment that makes the canonical orchestrator capable of running
      # it. Everything below is local to the runner and destroyed afterwards:
      #
      #   * loopback-only Supabase stack — scripts/p2-13/isolation-guard.mjs refuses any
      #     non-loopback host, so this fixture physically cannot address a hosted project
      #   * keys are read from the started stack, never from a GitHub secret
      #   * the fixture actor password is generated per run and never persisted
      #
      # NO long-lived secret is required, so fork PRs remain safe. Hosted Supabase, the
      # ACTIVE PMFreak project, the hosted migration-validation project and any shared
      # staging environment are all out of reach by construction.
      - name: Start isolated local Supabase fixture
        run: npx -y supabase start

      - name: Export ephemeral fixture environment
        run: |
          set -euo pipefail
          # `supabase status -o env` emits the started stack's own values.
          eval "$(npx -y supabase status -o env)"
          # Mask BEFORE the values are used anywhere, so a later failure cannot echo them.
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          echo "::add-mask::${ANON_KEY}"
          {
            echo "OPERATIONAL_FLOW_TEST_SUPABASE_URL=${API_URL}"
            echo "OPERATIONAL_FLOW_TEST_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "OPERATIONAL_FLOW_TEST_ANON_KEY=${ANON_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "OPERATIONAL_FLOW_TEST_DATABASE_URL=${DB_URL}"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
            # scripts/p2-13/isolation-guard.mjs requires this to equal EXPECTED_APP_ORIGIN
            # EXACTLY, and refuses anything else. Loopback-only by construction: a hosted
            # app origin can never satisfy it, so the guard stays fail-closed.
            echo "OPERATIONAL_FLOW_TEST_BASE_URL=http://localhost:3000"
            echo "P2_13_FOUNDER_FIXTURE_ENABLED=true"
            echo "P2_13_ALLOW_LOCAL_RESET=true"
            echo "OPERATIONAL_FLOW_TEST_ALLOW_DESTRUCTIVE=true"
          } >> "$GITHUB_ENV"
          # Ephemeral, per-run, never persisted and never echoed.
          FIXTURE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${FIXTURE_PASSWORD}"
          echo "P2_13_FIXTURE_ACTOR_PASSWORD=${FIXTURE_PASSWORD}" >> "$GITHUB_ENV"

      # The scenario harness requires an explicit subcommand
      # (preflight|seed|verify|reset|reseed); invoking it bare exits with a usage error,
      # which is exactly how the first real Release Governance run failed. A seed failure
      # must still fail the job — there is no bypass here.
      - name: Seed the deterministic P2-13 founder fixture
        run: npm run seed:p2-13-founder -- seed

      # Blocking/advisory severity is owned by scripts/check-beta-release.mjs, which exits
      # 1 only on a BLOCKING gate failure — advisory gates report CONDITIONAL/WARN and are
      # tracked in docs/release/residual-risk-register.md. That classification is NOT
      # reinterpreted here: no `continue-on-error`, no `|| true`, no exit-code rewriting.
      # The job's success is exactly the orchestrator's own GO / CONDITIONAL GO decision.
      - name: Beta release gate
        run: npm run check:beta-release
      # Destruction always runs, including on gate failure, timeout and cancellation.
      - name: Stop isolated local Supabase fixture
        if: always()
        run: npx -y supabase stop --no-backup

      # `.beta-release-logs/` is a DOTFILE path, and upload-artifact@v4 excludes hidden
      # files by default — so the gate's per-test TAP output existed on the runner and was
      # never uploaded. With `if-no-files-found: warn` the step also went green, which is
      # how run 33884190936 failed one test and left no way to learn which: the job log
      # keeps only the tail after the failure. `warn` is kept deliberately (a cancelled run
      # before the gate writes anything must not fail the job); the hidden-file inclusion is
      # what makes the logs actually arrive.
      - name: Upload beta release gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-logs-${{ github.run_id }}
          path: .beta-release-logs/
          include-hidden-files: true
          if-no-files-found: warn

  release:
    name: Release / Changesets
    runs-on: ubuntu-latest
    needs: beta-release-validation
    # Belt and braces: `needs` orders the jobs; this condition is what makes a
    # pull_request run structurally incapable of reaching a write-authorised job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:release-readiness
      - name: Create release PR / versions
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package purity
        run: npm run check:package-purity
